name = "freeagentstore-host"
main = "src/index.ts"
compatibility_date = "2026-01-01"
workers_dev = false

[[routes]]
pattern = "freeagentstore.online/*"
zone_name = "freeagentstore.online"

[[routes]]
pattern = "*.freeagentstore.online/*"
zone_name = "freeagentstore.online"

[vars]
GITHUB_CLIENT_ID = "Ov23linoTyxg6znK9LmO"

[[r2_buckets]]
binding = "AGENTS"
bucket_name = "fags-agents"

[durable_objects]
bindings = [
  { name = "MIRROR_ROOMS", class_name = "MirrorRoom" }
]

[[migrations]]
tag = "v1"
new_classes = ["MirrorRoom"]

[[d1_databases]]
binding = "DB"
database_name = "fags"
database_id = "2f5cd397-8566-4e45-a76c-84553b701c02"
migrations_dir = "migrations"

# Shared with the MCP worker (freeagentstore-mcp). Host writes one-time MCP login
# codes here (mcpcode:*) for /v1/auth/github/start → /v1/auth/mcp/exchange.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "da354fa2f773497b93671d3f2fdd2979"
