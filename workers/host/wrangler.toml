name = "freeagentstore-host"
main = "src/index.ts"
compatibility_date = "2026-01-01"
workers_dev = false

[[routes]]
pattern = "freeagentstore.online/*"
zone_name = "freeagentstore.online"

[[routes]]
pattern = "*.freeagentstore.online/*"
zone_name = "freeagentstore.online"

[vars]
GITHUB_CLIENT_ID = ""

[[r2_buckets]]
binding = "AGENTS"
bucket_name = "fags-agents"

[[d1_databases]]
binding = "DB"
database_name = "fags"
database_id = "2f5cd397-8566-4e45-a76c-84553b701c02"
migrations_dir = "migrations"
