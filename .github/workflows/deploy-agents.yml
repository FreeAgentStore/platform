name: Deploy Agents to R2
on:
  push:
    branches: [main]
    paths:
      - 'agents/**'
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Existing agent slugs to rebuild (space-separated); empty uses changed agents'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-agents
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Detect changed agents
        id: changed
        env:
          REQUESTED_SLUGS: ${{ inputs.slugs }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$REQUESTED_SLUGS" ]; then
            SLUGS="$REQUESTED_SLUGS"
          else
            SLUGS=$(git diff --name-only HEAD~1 -- agents/ \
              | awk -F/ '/^agents\// {print $2}' \
              | sort -u \
              | tr '\n' ' ')
          fi
          for SLUG in $SLUGS; do
            [[ "$SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo 'Invalid agent slug'; exit 1; }
            [ -d "agents/$SLUG" ] || { echo 'Unknown agent slug'; exit 1; }
          done
          SLUGS=$(printf '%s\n' $SLUGS | sort -u | tr '\n' ' ')
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"
          echo "Changed agents: $SLUGS"

      - name: Build and upload agents
        if: steps.changed.outputs.slugs != ''
        env:
          AGENT_SLUGS: ${{ steps.changed.outputs.slugs }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for SLUG in $AGENT_SLUGS; do
            echo "--- Building $SLUG ---"
            if [ ! -d "agents/$SLUG/web" ]; then
              echo "No web/ directory for $SLUG, skipping"
              continue
            fi

            cd agents/$SLUG/web
            npm install
            npm run build
            cd ../../..

            # Use the approved catalogue identity and validate the actual upload artifact.
            node store/runtime-metadata.js "$SLUG" "agents/$SLUG/web/dist/index.html"

            echo "--- Uploading $SLUG to R2 ---"
            aws s3 sync agents/$SLUG/web/dist/ s3://fags-agents/agents/$SLUG/ \
              --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
              --delete

            echo "--- Upserting D1 route for $SLUG ---"
            npx wrangler d1 execute fags --remote --command \
              "INSERT OR IGNORE INTO routes (slug, zone, r2_prefix, store, hosted_on, created_at, updated_at) VALUES ('$SLUG', 'freeagentstore.online', 'agents/$SLUG', 'agents', 'r2', strftime('%s','now'), strftime('%s','now'))"

            echo "--- Done: $SLUG ---"
          done
